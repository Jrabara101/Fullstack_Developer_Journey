<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Tactical Reticle -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="2.5" fill="#f59e0b"/>
  <!-- Crosshair Hash lines -->
  <line x1="32" y1="7" x2="32" y2="17" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="57" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="17" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="57" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
