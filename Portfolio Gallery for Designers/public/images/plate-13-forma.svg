      <line x1="180" y1="0" x2="180" y2="18" />
      <line x1="200" y1="0" x2="200" y2="22" />
      <line x1="220" y1="0" x2="220" y2="11" />
      <line x1="240" y1="0" x2="240" y2="18" />
      <line x1="260" y1="0" x2="260" y2="11" />
      <line x1="280" y1="0" x2="280" y2="18" />
