      <line x1="440" y1="0" x2="440" y2="18" />
      <line x1="460" y1="0" x2="460" y2="11" />
      <line x1="480" y1="0" x2="480" y2="18" />
      <line x1="500" y1="0" x2="500" y2="22" />
    </g>
    <text x="518" y="29" font-family="JetBrains Mono, monospace" font-size="11" fill="#4A3B1E">1:50</text>
  </g>
